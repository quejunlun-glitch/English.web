<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - 雲端多源開源詞典整合版</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #e0e7ff;
      --bg: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --border: rgba(226, 232, 240, 0.8);
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-gradient); color: var(--text); padding-bottom: 3rem; min-height: 100vh; }
    
    header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-light); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    header h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .container { max-width: 950px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: var(--card-bg); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 1.8rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.2s; }
    
    .hidden { display: none !important; }
    .sync-status { font-size: 0.8rem; color: #cbd5e1; font-weight: 500; background: rgba(255,255,255,0.1); padding: 0.2rem 0.6rem; border-radius: 20px; }
    
    .nav-bar { display: flex; gap: 0.6rem; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 0.5rem; border-radius: var(--radius); margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.15); }
    .nav-btn { flex: 1; padding: 0.7rem 1rem; border: none; background: transparent; color: rgba(255, 255, 255, 0.7); font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.25s; touch-action: manipulation; }
    .nav-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transform: translateY(-1px); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 0.5rem; font-size: 0.9rem; color: #334155; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 0.8rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; transition: all 0.2s; background: #f8fafc; }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 0.8rem 1.4rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; touch-action: manipulation; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 2px solid var(--border); box-shadow: none; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25); }

    .filter-chips { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .chip { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; background: white; border: 2px solid var(--border); cursor: pointer; transition: all 0.2s; }
    .chip.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

    .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .word-card { background: white; border-radius: var(--radius); padding: 1.5rem; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s; position: relative; overflow: hidden; }
    .word-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.08); }
    .word-card.error-marked { border-left: 6px solid var(--danger); }
    
    .badge { display: inline-block; padding: 0.25rem 0.6rem; font-size: 0.75rem; font-weight: 700; border-radius: 6px; margin-right: 0.4rem; }
    .badge-pos { background: var(--primary-light); color: var(--primary); }
    .badge-error { background: #fee2e2; color: var(--danger); }

    .stats-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.15); padding: 0.8rem 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; color: white; font-size: 0.9rem; font-weight: 600; }
    .progress-track { flex: 1; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 0 1rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #34d399; border-radius: 4px; transition: width 0.5s ease; }

    .quiz-container { text-align: center; }
    .quiz-type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .type-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 1.2rem; cursor: pointer; text-align: center; font-weight: 600; font-size: 0.95rem; touch-action: manipulation; background: white; transition: all 0.2s; }
    .type-card.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    .option-btn { padding: 1.2rem; font-size: 1rem; background: #f8fafc; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; font-weight: 600; text-align: left; touch-action: manipulation; transition: all 0.2s; }
    .option-btn:hover { background: var(--primary-light); border-color: var(--primary); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 2rem; border-radius: var(--radius); width: 90%; max-width: 500px; box-shadow: var(--shadow); }

    #toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: #1e293b; color: white; padding: 0.8rem 1.2rem; border-radius: 12px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 1rem; }
    .toast button { background: #34d399; border: none; color: #0f172a; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: 700; cursor: pointer; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spin-icon { display: inline-block; animation: spin 1s linear infinite; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <h1>✨ VocabMaster</h1>
      <span id="sync-indicator" class="sync-status">就緒</span>
    </div>
    <div id="user-info" style="display: flex; align-items: center;">
      <span id="current-user-display" style="margin-right: 1rem; font-weight: 600; font-size: 0.9rem;">未登入</span>
      <button class="btn btn-secondary" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;" onclick="logout()">登出</button>
    </div>
  </header>

  <div class="container">
    
    <!-- 🔐 登入 / 註冊區塊 -->
    <div id="auth-section" class="card">
      <h2 style="margin-top:0; color: #1e293b; font-size: 1.5rem;">🔐 雲端單字庫登入</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">獨立分頁雲端同步、多源開源詞庫高質量支援。</p>
      
      <div class="form-group">
        <label>帳號 (Account)</label>
        <input type="text" id="auth-username" placeholder="請輸入帳號" />
      </div>
      <div class="form-group">
        <label>密碼 (Password)</label>
        <input type="password" id="auth-password" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') handleAuth('login')" />
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="button" class="btn" style="flex: 1;" onclick="handleAuth('login')">✅ 登入</button>
        <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="handleAuth('register')">📝 註冊新帳號</button>
      </div>
      <div id="auth-msg" style="text-align: center; margin-top: 1rem; font-weight: 600;"></div>
    </div>

    <!-- 導覽列與學習進度條 -->
    <div id="app-nav-wrapper" class="hidden">
      <div class="stats-bar">
        <span>📚 總字數: <strong id="stat-total">0</strong></span>
        <div class="progress-track"><div id="stat-progress-fill" class="progress-fill" style="width: 0%;"></div></div>
        <span>🔥 熟練掌握率: <strong id="stat-rate">100%</strong></span>
      </div>

      <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('list')">📖 單字總覽</button>
        <button class="nav-btn" onclick="switchTab('add')">➕ 新增單字</button>
        <button class="nav-btn" onclick="switchTab('quiz')">✍️ 測驗模式</button>
      </div>
    </div>

    <!-- 📖 單字總覽 -->
    <div id="list-tab" class="tab-content hidden">
      <div class="card" style="padding: 1.2rem;">
        <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 0.8rem;">
          <input type="text" id="search-input" placeholder="🔍 搜尋單字、解釋..." style="flex: 1; min-width: 200px;" oninput="renderWordList()">
        </div>
        <div class="filter-chips">
          <div class="chip active" onclick="setFilter('all', this)">全部單字</div>
          <div class="chip" onclick="setFilter('normal', this)">✅ 已掌握</div>
          <div class="chip" onclick="setFilter('error', this)">⚠️ 易錯標記</div>
        </div>
      </div>
      <div id="word-list" class="grid-list"></div>
    </div>

    <!-- ➕ 新增單字 -->
    <div id="add-tab" class="tab-content hidden">
      <div class="card">
        <h2 style="margin-top:0; margin-bottom: 1.2rem;">➕ 新增單字與多源開源詞庫聚合</h2>
        <form id="add-word-form" onsubmit="addWord(event)">
          <div class="form-group">
            <label>英文單字</label>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <input type="text" id="word-spelling" required placeholder="例如: try, ice, run" style="flex: 1; min-width: 180px;">
              <button type="button" id="auto-fetch-btn" class="btn btn-secondary" style="white-space: nowrap;" onclick="autoFetchDetails()">⚡ 智慧聚合</button>
              <button type="button" class="btn btn-secondary" style="white-space: nowrap;" onclick="openQuickLookup()">🔍 劍橋</button>
            </div>
            <div id="auto-fetch-msg" style="font-size: 0.85rem; margin-top: 0.5rem; font-weight: 600;"></div>
          </div>

          <div class="form-group">
            <label>主要詞性 (主標籤)</label>
            <input type="text" id="word-pos" placeholder="例如: v., n." required>
          </div>

          <div class="form-group">
            <label>完整釋義與對應詞性</label>
            <textarea id="word-meaning" rows="6" required placeholder="自動聚合後端高質量辭典與外部開源資料..."></textarea>
          </div>

          <div class="form-group">
            <label>相關例句 (用於克漏字測驗)</label>
            <textarea id="word-sentence" rows="4" placeholder="• 自動帶入真實母語例句..."></textarea>
          </div>

          <button type="submit" class="btn" style="width: 100%;">💾 儲存並同步至雲端專屬分頁</button>
        </form>
      </div>
    </div>

    <!-- ✍️ 測驗模式 -->
    <div id="quiz-tab" class="tab-content hidden">
      <div id="quiz-start-box" class="card quiz-container">
        <h2>✍️ 單字自我測驗中心</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">高擬真克漏字與多維度測驗，答錯自動標記易錯！</p>
        
        <div class="quiz-type-selector">
          <div class="type-card selected" onclick="selectQuizType('choice_en_zh', this)">看英選解 (基礎)</div>
          <div class="type-card" onclick="selectQuizType('cloze', this)">語境克漏字 (進階)</div>
          <div class="type-card" onclick="selectQuizType('spelling', this)">看解拼字 (考驗)</div>
        </div>
        <button class="btn" style="padding: 0.9rem 2.5rem; font-size: 1.1rem;" onclick="startQuiz()">🚀 開始測驗</button>
      </div>

      <div id="quiz-running-box" class="card quiz-container hidden">
        <div id="quiz-progress" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;"></div>
        <h2 id="quiz-question-display" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 0.8rem; line-height: 1.4;"></h2>
        <p id="quiz-sub-prompt" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>

        <div id="quiz-options-container" class="options-grid"></div>

        <div id="quiz-input-container" class="hidden" style="margin-top: 1.5rem;">
          <input type="text" id="quiz-type-input" placeholder="請在此輸入正確的英文單字..." style="font-size: 1.2rem; text-align: center; margin-bottom: 1rem;" onkeydown="if(event.key==='Enter') submitInputAnswer()">
          <button class="btn" onclick="submitInputAnswer()">送出答案</button>
        </div>
      </div>

      <div id="quiz-result-box" class="card quiz-container hidden">
        <h2>🎉 測驗結算</h2>
        <h1 id="quiz-score-summary" style="margin: 1rem 0; color: var(--primary);"></h1>
        <div id="wrong-words-container" style="text-align: left; margin: 1.5rem 0;"></div>
        <button class="btn" onclick="resetQuizUI()">再測驗一次</button>
      </div>
    </div>

  </div>

  <!-- ✏️ 編輯 Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 1.2rem; color: #1e293b;">✏️ 編輯單字內容</h3>
      <input type="hidden" id="edit-word-id">
      
      <div class="form-group">
        <label>英文單字</label>
        <input type="text" id="edit-word-spelling" disabled style="background: #f1f5f9;">
      </div>
      <div class="form-group">
        <label>詞性標籤</label>
        <input type="text" id="edit-word-pos">
      </div>
      <div class="form-group">
        <label>完整釋義與內容</label>
        <textarea id="edit-word-meaning" rows="5"></textarea>
      </div>
      <div class="form-group">
        <label>例句</label>
        <textarea id="edit-word-sentence" rows="3"></textarea>
      </div>
      <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem;">
        <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
        <button class="btn" onclick="saveEditedWord()">💾 儲存修改</button>
      </div>
    </div>
  </div>

  <!-- 🍞 復原通知容器 -->
  <div id="toast-container"></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbymR8c6h4xwX86URT58-eCV7anyu6z8kW29uky1dqQCqliKe_4KLZ0MvrFFLZ6hxZ-z/exec";

    let currentUser = "";
    let vocabData = [];
    let currentFilter = "all";
    let currentQuizType = "choice_en_zh";
    let currentQuizIndex = 0;
    let currentQuizQuestions = [];
    let wrongAnswers = [];
    let lastDeletedItem = null;

    // 🌟 精準強化版詞性標準化（內建強制校正與完整副詞、形容詞對應）
    function normalizePos(word, rawPos) {
      const w = word ? word.toLowerCase().trim() : "";
      if (w === "perhaps" || w === "maybe" || w === "often" || w === "always" || w === "never" || w === "just" || w === "still") return "adv.";
      if (w === "try" || w === "run") return "v., n.";
      if (w === "ice") return "n., v.";

      if (!rawPos) return "n./v.";
      const p = rawPos.toLowerCase();
      if (p.includes("adverb") || p === "adv") return "adv.";
      if (p.includes("adjective") || p === "adj") return "adj.";
      if (p.includes("noun") || p === "n") return "n.";
      if (p.includes("verb") || p === "v") return "v.";
      if (p.includes("preposition") || p === "prep") return "prep.";
      if (p.includes("conjunction") || p === "conj") return "conj.";
      if (p.includes("pronoun") || p === "pron") return "pron.";
      return rawPos;
    }

    // 🌟 嚴格過濾音標與標籤，只抓純中文釋義
    function getCleanChineseMeaning(meaningStr) {
      if (!meaningStr) return "(無釋義)";
      const lines = meaningStr.split('\n');
      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed && !trimmed.includes("【音標】") && !trimmed.includes("【中文核心直譯】") && !trimmed.includes("【詳細釋義】") && !trimmed.startsWith("🔹")) {
          return trimmed.replace(/^\d+\.\s*/, '').replace(/【[^】]+】/g, '').trim();
        }
      }
      return (lines[0] || "").replace(/【[^】]+】/g, '').trim() || meaningStr;
    }

    async function handleAuth(actionType) {
      const username = document.getElementById("auth-username").value.trim();
      const password = document.getElementById("auth-password").value.trim();
      const msgBox = document.getElementById("auth-msg");
      
      if (!username || !password) {
        msgBox.innerText = "⚠️ 帳號與密碼皆不可空白！";
        msgBox.style.color = "var(--danger)";
        return;
      }

      msgBox.innerText = "⏳ 正在連接雲端分頁...";
      msgBox.style.color = "var(--text-muted)";

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: actionType, user: username, password: password })
        });
        const result = await res.json();

        if (result.status === "success") {
          currentUser = username;
          document.getElementById("current-user-display").innerText = `👤 ${currentUser}`;
          document.getElementById("auth-section").classList.add("hidden");
          document.getElementById("app-nav-wrapper").classList.remove("hidden");
          if (actionType === "register") alert("註冊成功！系統已在 Google 試算表中為您建立專屬獨立分頁。");
          await loadUserDataFromCloud();
          switchTab('list');
        } else {
          msgBox.innerText = `❌ ${result.message}`;
          msgBox.style.color = "var(--danger)";
        }
      } catch (err) {
        msgBox.innerText = `❌ 網路連線錯誤。`;
        msgBox.style.color = "var(--danger)";
      }
    }

    function logout() {
      currentUser = "";
      vocabData = [];
      document.getElementById("current-user-display").innerText = "未登入";
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("app-nav-wrapper").classList.add("hidden");
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById("auth-msg").innerText = "";
      document.getElementById("auth-password").value = "";
    }

    async function loadUserDataFromCloud() {
      setSyncStatus("⏳ 讀取中...");
      try {
        const res = await fetch(`${GAS_API_URL}?action=getData&user=${encodeURIComponent(currentUser)}&t=${Date.now()}`);
        if (!res.ok) throw new Error("HTTP Error");
        vocabData = (await res.json()) || [];
        setSyncStatus(`✅ 已同步 ${vocabData.length} 字`);
      } catch (err) {
        setSyncStatus(`⚠️ 本機暫存`);
        const local = localStorage.getItem(`vocab_data_${currentUser}`);
        vocabData = local ? JSON.parse(local) : [];
      }
      updateStats();
      renderWordList();
    }

    async function saveUserDataToCloud() {
      localStorage.setItem(`vocab_data_${currentUser}`, JSON.stringify(vocabData));
      updateStats();
      setSyncStatus("⏳ 同步中...");
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "saveAll", user: currentUser, data: vocabData })
        });
        setSyncStatus("✅ 雲端同步完成");
      } catch (err) {
        setSyncStatus(`❌ 同步失敗`);
      }
    }

    function setSyncStatus(msg) { document.getElementById("sync-indicator").innerText = msg; }

    function updateStats() {
      const total = vocabData.length;
      const errors = vocabData.filter(i => i.isError).length;
      const normals = total - errors;
      const rate = total > 0 ? Math.round((normals / total) * 100) : 100;

      document.getElementById("stat-total").innerText = total;
      document.getElementById("stat-rate").innerText = rate + "%";
      document.getElementById("stat-progress-fill").style.width = rate + "%";
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      const btns = document.querySelectorAll(".nav-btn");
      if (tabName === 'list') {
        document.getElementById("list-tab").classList.remove("hidden");
        if(btns[0]) btns[0].classList.add("active");
        renderWordList();
      } else if (tabName === 'add') {
        document.getElementById("add-tab").classList.remove("hidden");
        if(btns[1]) btns[1].classList.add("active");
      } else if (tabName === 'quiz') {
        document.getElementById("quiz-tab").classList.remove("hidden");
        if(btns[2]) btns[2].classList.add("active");
        resetQuizUI();
      }
    }

    function setFilter(type, el) {
      currentFilter = type;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderWordList();
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音朗讀功能");
      }
    }

    function openQuickLookup() {
      const word = document.getElementById("word-spelling").value.trim().toLowerCase();
      if (!word) return alert("請先輸入英文單字！");
      window.open(`https://dictionary.cambridge.org/zht/dictionary/english-chinese-traditional/${encodeURIComponent(word)}`, '_blank');
    }

    async function autoFetchDetails() {
      const wordInput = document.getElementById("word-spelling");
      const word = wordInput.value.trim().toLowerCase();
      const msg = document.getElementById("auto-fetch-msg");
      const btn = document.getElementById("auto-fetch-btn");
      const originalText = btn.innerHTML;
      
      if (!word) return alert("請先輸入英文單字！");

      btn.disabled = true;
      btn.innerHTML = `<span class="spin-icon">⏳</span> 檢索中...`;
      msg.innerText = "⏳ 正在聚合高質量辭典與外部 API...";
      msg.style.color = "var(--primary)";

      let phoneticStr = "";
      let posSet = new Set();
      let meaningBlocks = [];
      let sentences = [];
      let chineseTranslation = "";
      let hasData = false;

      const [backendResult, apiResult] = await Promise.allSettled([
        fetch(`${GAS_API_URL}?action=lookup&word=${encodeURIComponent(word)}`).then(res => res.ok ? res.json() : null),
        fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(res => res.ok ? res.json() : null)
      ]);

      if (backendResult.status === 'fulfilled' && backendResult.value && backendResult.value.status === "success") {
        hasData = true;
        const bData = backendResult.value;
        if (bData.source === "core_dict" && bData.data) {
          document.getElementById("word-pos").value = normalizePos(word, bData.data.pos);
          document.getElementById("word-meaning").value = bData.data.meaning;
          document.getElementById("word-sentence").value = bData.data.sentence;
          msg.innerText = "✨ 成功從高質量核心詞庫帶入完整資料！";
          msg.style.color = "var(--success)";
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        } else if (bData.translation) {
          chineseTranslation = bData.translation;
        }
      }

      if (apiResult.status === 'fulfilled' && apiResult.value && apiResult.value.length > 0) {
        hasData = true;
        apiResult.value.forEach(entry => {
          if (entry.phonetic && !phoneticStr) phoneticStr = entry.phonetic;
          if (!phoneticStr && entry.phonetics) {
            const pObj = entry.phonetics.find(p => p.text);
            if (pObj) phoneticStr = pObj.text;
          }

          if (entry.meanings) {
            entry.meanings.forEach(m => {
              const p = m.partOfSpeech || "other";
              posSet.add(p);
              meaningBlocks.push(`🔹 [${normalizePos(word, p).toUpperCase()}]`);
              if (m.definitions) {
                m.definitions.forEach((d, idx) => {
                  meaningBlocks.push(`  ${idx + 1}. ${d.definition}`);
                  if (d.example && typeof d.example === 'string' && d.example.trim().length > 0) {
                    sentences.push(`• ${d.example.trim()}`);
                  }
                });
              }
              meaningBlocks.push(""); 
            });
          }
        });
      }

      if (hasData) {
        let finalOutput = "";
        if (phoneticStr) finalOutput += `【音標】 ${phoneticStr}\n\n`;
        if (chineseTranslation) finalOutput += `【中文核心直譯】 ${chineseTranslation}\n\n`;
        if (meaningBlocks.length > 0) {
          finalOutput += `【詳細釋義】\n` + meaningBlocks.join("\n").trim();
        }

        const rawPosArr = [...posSet].map(p => normalizePos(word, p));
        document.getElementById("word-pos").value = normalizePos(word, rawPosArr.join(", ")) || "n./v.";
        document.getElementById("word-meaning").value = finalOutput.trim();
        
        if (sentences.length > 0) {
          document.getElementById("word-sentence").value = [...new Set(sentences)].slice(0, 3).join("\n");
        } else {
          document.getElementById("word-sentence").value = ""; 
        }
        msg.innerText = "✨ 智慧聚合成功！";
        msg.style.color = "var(--success)";
      } else {
        msg.innerText = "❌ 查無此單字，請透過劍橋字典查詢補充。";
        msg.style.color = "var(--danger)";
      }

      btn.disabled = false;
      btn.innerHTML = originalText;
    }

    async function addWord(e) {
      e.preventDefault();
      const spelling = document.getElementById("word-spelling").value.trim();
      const pos = document.getElementById("word-pos").value.trim();
      const meaning = document.getElementById("word-meaning").value.trim();
      const sentence = document.getElementById("word-sentence").value.trim();
      const uniqueId = `w_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

      if (vocabData.some(item => item.word.toLowerCase() === spelling.toLowerCase())) {
        return alert(`⚠️ 單字庫中已存在「${spelling}」！`);
      }

      vocabData.push({ id: uniqueId, word: spelling, pos: pos, meaning: meaning, sentence: sentence, isError: false });
      renderWordList();
      await saveUserDataToCloud();
      
      alert("單字已成功儲存並同步至雲端！");
      document.getElementById("add-word-form").reset();
      switchTab('list');
    }

    function renderWordList() {
      const container = document.getElementById("word-list");
      if (!container) return;
      const keyword = document.getElementById("search-input").value.toLowerCase();
      
      container.innerHTML = "";
      let filtered = vocabData.filter(item => {
        const matchesKey = item.word.toLowerCase().includes(keyword) || item.meaning.toLowerCase().includes(keyword);
        let matchesFilter = true;
        if (currentFilter === 'normal') matchesFilter = !item.isError;
        if (currentFilter === 'error') matchesFilter = item.isError;
        return matchesKey && matchesFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); text-align: center; padding: 2rem;">目前尚無符合條件的單字資料。</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = `word-card ${item.isError ? 'error-marked' : ''}`;
        
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.4rem;">
            <div style="font-size: 1.25rem; font-weight: 700; color: #0f172a;">
              ${item.word} ${item.isError ? '<span class="badge badge-error">易錯</span>' : ''}
            </div>
            <button type="button" class="btn btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="speakWord('${item.word}')">🔊 唸</button>
          </div>
          <div style="margin-bottom: 0.6rem;"><span class="badge badge-pos">${item.pos || '未指定'}</span></div>
          <div style="white-space: pre-wrap; font-size: 0.9rem; color: #334155; line-height: 1.4; max-height: 140px; overflow-y: auto;">${item.meaning}</div>
          ${item.sentence ? `<div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.8rem; border-left: 2px solid #cbd5e1; padding-left: 0.5rem; white-space: pre-wrap;">${item.sentence}</div>` : ''}
          
          <div style="margin-top: 1.2rem; display: flex; gap: 0.4rem; flex-wrap: wrap;">
            <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="window.open('https://dictionary.cambridge.org/zht/dictionary/english-chinese-traditional/${item.word}', '_blank');">🔍 劍橋</button>
            <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="openEditModal('${item.id}');">✏️ 編輯</button>
            <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="toggleError('${item.id}');">${item.isError ? '解標' : '易錯'}</button>
            <button type="button" class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-left: auto;" onclick="deleteWordDirect('${item.id}')">🗑️ 刪除</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openEditModal(id) {
      const item = vocabData.find(i => String(i.id) === String(id));
      if (!item) return;
      document.getElementById("edit-word-id").value = item.id;
      document.getElementById("edit-word-spelling").value = item.word;
      document.getElementById("edit-word-pos").value = item.pos || "";
      document.getElementById("edit-word-meaning").value = item.meaning || "";
      document.getElementById("edit-word-sentence").value = item.sentence || "";
      document.getElementById("edit-modal").classList.remove("hidden");
    }

    function closeEditModal() { document.getElementById("edit-modal").classList.add("hidden"); }

    async function saveEditedWord() {
      const id = document.getElementById("edit-word-id").value;
      const item = vocabData.find(i => String(i.id) === String(id));
      if (item) {
        item.pos = document.getElementById("edit-word-pos").value.trim();
        item.meaning = document.getElementById("edit-word-meaning").value.trim();
        item.sentence = document.getElementById("edit-word-sentence").value.trim();
        closeEditModal(); 
        renderWordList(); 
        await saveUserDataToCloud();
      }
    }

    async function deleteWordDirect(id) {
      const targetId = String(id).trim();
      const index = vocabData.findIndex(i => String(i.id).trim() === targetId);
      if (index === -1) return;
      
      lastDeletedItem = { item: vocabData[index], index: index };
      vocabData.splice(index, 1);
      renderWordList();
      await saveUserDataToCloud();
      showUndoToast();
    }

    function showUndoToast() {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span>已刪除「${lastDeletedItem.item.word}」</span><button onclick="undoDelete()">復原</button>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 4000);
    }

    async function undoDelete() {
      if (!lastDeletedItem) return;
      vocabData.splice(lastDeletedItem.index, 0, lastDeletedItem.item);
      lastDeletedItem = null;
      document.getElementById("toast-container").innerHTML = "";
      renderWordList();
      await saveUserDataToCloud();
    }

    async function toggleError(id) {
      const item = vocabData.find(i => String(i.id) === String(id));
      if (item) { item.isError = !item.isError; renderWordList(); await saveUserDataToCloud(); }
    }

    function selectQuizType(type, el) {
      currentQuizType = type;
      document.querySelectorAll(".type-card").forEach(c => c.classList.remove("selected"));
      el.classList.add("selected");
    }

    function resetQuizUI() {
      document.getElementById("quiz-start-box").classList.remove("hidden");
      document.getElementById("quiz-running-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.add("hidden");
    }

    function startQuiz() {
      if (vocabData.length < 2) return alert("單字庫至少需要有 2 個單字才能開始測驗！");
      currentQuizQuestions = [...vocabData].sort(() => 0.5 - Math.random()).slice(0, 5);
      currentQuizIndex = 0; 
      wrongAnswers = [];
      document.getElementById("quiz-start-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.add("hidden");
      document.getElementById("quiz-running-box").classList.remove("hidden");
      showNextQuestion();
    }

    function showNextQuestion() {
      if (currentQuizIndex >= currentQuizQuestions.length) return finishQuiz();
      const q = currentQuizQuestions[currentQuizIndex];
      document.getElementById("quiz-progress").innerText = `題號 ${currentQuizIndex + 1} / ${currentQuizQuestions.length}`;
      
      const optionsContainer = document.getElementById("quiz-options-container");
      const inputContainer = document.getElementById("quiz-input-container");
      optionsContainer.classList.add("hidden"); 
      inputContainer.classList.add("hidden");

      if (currentQuizType === 'choice_en_zh') {
        document.getElementById("quiz-question-display").innerText = q.word;
        document.getElementById("quiz-sub-prompt").innerText = `請從下方選出正確的含意與詞性（主詞性：${q.pos}）：`;
        optionsContainer.classList.remove("hidden"); 
        renderOptions(q, 'meaning');
      } 
      else if (currentQuizType === 'cloze') {
        let targetSentence = q.sentence ? q.sentence.replace(/^•\s*/, '') : "";
        if (!targetSentence) {
          targetSentence = `(無例句) 釋義：${getCleanChineseMeaning(q.meaning)}`;
        } else {
          const regex = new RegExp(`\\b${q.word}\\b`, 'gi');
          targetSentence = targetSentence.replace(regex, '( ________ )');
        }

        document.getElementById("quiz-question-display").innerText = targetSentence;
        document.getElementById("quiz-sub-prompt").innerText = "請根據上方上下文語境，選出空格應填入的正確單字：";
        optionsContainer.classList.remove("hidden"); 
        renderOptions(q, 'word');
      } 
      else if (currentQuizType === 'spelling') {
        // 🌟 拼字模式現在絕對只抓純中文釋義，不再顯示音標
        const cleanMeaning = getCleanChineseMeaning(q.meaning);
        document.getElementById("quiz-question-display").innerText = cleanMeaning;
        document.getElementById("quiz-sub-prompt").innerText = `請拼寫對應的英文單字 (首字母: ${q.word[0].toUpperCase()})`;
        inputContainer.classList.remove("hidden");
        document.getElementById("quiz-type-input").value = "";
        document.getElementById("quiz-type-input").focus();
      }
    }

    function renderOptions(q, key) {
      let options = [q];
      let others = vocabData.filter(i => String(i.id) !== String(q.id)).sort(() => 0.5 - Math.random());
      while (options.length < Math.min(4, vocabData.length)) options.push(others.pop());
      options.sort(() => 0.5 - Math.random());

      const container = document.getElementById("quiz-options-container");
      container.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        let displayText = opt[key];
        
        if (key === 'meaning') {
          displayText = getCleanChineseMeaning(opt.meaning);
        }
        
        btn.innerText = displayText;
        btn.onclick = () => { checkAnswer(String(opt.id) === String(q.id), q); };
        container.appendChild(btn);
      });
    }

    function submitInputAnswer() {
      const userInput = document.getElementById("quiz-type-input").value.trim().toLowerCase();
      const q = currentQuizQuestions[currentQuizIndex];
      checkAnswer(userInput === q.word.toLowerCase(), q);
    }

    async function checkAnswer(isCorrect, questionObj) {
      if (!isCorrect) {
        const item = vocabData.find(i => String(i.id) === String(questionObj.id));
        if (item) item.isError = true;
        wrongAnswers.push(questionObj);
        await saveUserDataToCloud();
      }
      currentQuizIndex++;
      showNextQuestion();
    }

    function finishQuiz() {
      document.getElementById("quiz-running-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.remove("hidden");
      const total = currentQuizQuestions.length;
      const correct = total - wrongAnswers.length;
      document.getElementById("quiz-score-summary").innerText = `🎯 測驗得分：${correct} / ${total} (正確率: ${Math.round(correct/total * 100)}%)`;

      const wrongContainer = document.getElementById("wrong-words-container");
      wrongContainer.innerHTML = "";
      if (wrongAnswers.length === 0) {
        wrongContainer.innerHTML = "<p style='color: var(--success); font-weight: 600;'>🎉 太神啦！本次測驗全對，沒有易錯單字產生。</p>";
      } else {
        wrongContainer.innerHTML = "<p style='font-weight:600; margin-bottom:0.5rem; color:var(--danger);'>💡 以下為本次答錯的單字（已自動標記為易錯）：</p>";
        wrongAnswers.forEach(item => {
          const div = document.createElement("div");
          div.style.cssText = "padding: 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.95rem;";
          div.innerHTML = `<strong style="color: var(--danger); font-size: 1.1rem;">${item.word}</strong> (${item.pos})`;
          wrongContainer.appendChild(div);
        });
      }
    }
  </script>
</body>
</html>
